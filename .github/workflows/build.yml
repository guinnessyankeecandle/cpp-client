name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang \
            libssl-dev libcurl4-openssl-dev nlohmann-json3-dev \
            qrencode
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -Wno-dev
      - name: Build
        run: cmake --build build -j$(nproc)
