name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang \
            libssl-dev libcurl4-openssl-dev nlohmann-json3-dev \
            libftxui-dev catch2-dev qrencode
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -Wno-dev
      - name: Build tests
        run: cmake --build build --target cybersec_tests -j$(nproc)
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
