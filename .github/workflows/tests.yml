name: Tests

on:
  push:

env:
  OPENSSL_VERSION: "3.4.1"
  OPENSSL_PREFIX: "/usr/local/openssl"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL 3.4
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl
          curl -fsSL https://www.openssl.org/source/openssl-${{ env.OPENSSL_VERSION }}.tar.gz | tar xz
          cd openssl-${{ env.OPENSSL_VERSION }}
          ./Configure --prefix=${{ env.OPENSSL_PREFIX }} --openssldir=${{ env.OPENSSL_PREFIX }}/ssl --libdir=lib
          make -j$(nproc)
          sudo make install_sw
          echo "${{ env.OPENSSL_PREFIX }}/lib" | sudo tee /etc/ld.so.conf.d/00-custom-openssl.conf
          sudo ldconfig
      - name: Install dependencies
        run: sudo apt-get install -y ninja-build cmake clang libcurl4-openssl-dev nlohmann-json3-dev qrencode
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DOPENSSL_ROOT_DIR=${{ env.OPENSSL_PREFIX }} \
            -DCMAKE_BUILD_RPATH=${{ env.OPENSSL_PREFIX }}/lib \
            -Wno-dev
      - name: Build
        run: cmake --build build --target cybersec_tests -j$(nproc)
      - name: Verify OpenSSL version
        run: ldd build/cybersec_tests | grep crypto
      - name: Run
        run: ctest --test-dir build --output-on-failure

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL 3.4
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl
          curl -fsSL https://www.openssl.org/source/openssl-${{ env.OPENSSL_VERSION }}.tar.gz | tar xz
          cd openssl-${{ env.OPENSSL_VERSION }}
          ./Configure --prefix=${{ env.OPENSSL_PREFIX }} --openssldir=${{ env.OPENSSL_PREFIX }}/ssl --libdir=lib
          make -j$(nproc)
          sudo make install_sw
          echo "${{ env.OPENSSL_PREFIX }}/lib" | sudo tee /etc/ld.so.conf.d/00-custom-openssl.conf
          sudo ldconfig
      - name: Install dependencies
        run: sudo apt-get install -y ninja-build cmake clang llvm libcurl4-openssl-dev nlohmann-json3-dev qrencode
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build-coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
            -DOPENSSL_ROOT_DIR=${{ env.OPENSSL_PREFIX }} \
            -DCMAKE_BUILD_RPATH=${{ env.OPENSSL_PREFIX }}/lib \
            -Wno-dev
      - name: Build
        run: cmake --build build-coverage --target cybersec_tests -j$(nproc)
      - name: Run
        env:
          LLVM_PROFILE_FILE: "coverage-%p.profraw"
        run: ctest --test-dir build-coverage --output-on-failure
      - name: Merge profiles
        run: llvm-profdata merge -sparse coverage-*.profraw -o coverage.profdata
      - name: Report coverage
        run: |
          llvm-cov report ./build-coverage/cybersec_tests \
            -instr-profile=coverage.profdata \
            --ignore-filename-regex='_deps|\.test\.cpp' \
            | tee coverage_report.txt
          awk '/TOTAL/{if ($10+0 < 95.0) {print "Coverage below 95%: " $10; exit 1}}' \
            coverage_report.txt

  sanitise:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan
            cxx_flags: "-fsanitize=address -fno-omit-frame-pointer"
            linker_flags: "-fsanitize=address"
          - name: UBSan
            cxx_flags: "-fsanitize=undefined -fno-omit-frame-pointer"
            linker_flags: "-fsanitize=undefined"
          - name: TSan
            cxx_flags: "-fsanitize=thread -fno-omit-frame-pointer"
            linker_flags: "-fsanitize=thread"
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL 3.4
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl
          curl -fsSL https://www.openssl.org/source/openssl-${{ env.OPENSSL_VERSION }}.tar.gz | tar xz
          cd openssl-${{ env.OPENSSL_VERSION }}
          ./Configure --prefix=${{ env.OPENSSL_PREFIX }} --openssldir=${{ env.OPENSSL_PREFIX }}/ssl --libdir=lib
          make -j$(nproc)
          sudo make install_sw
          echo "${{ env.OPENSSL_PREFIX }}/lib" | sudo tee /etc/ld.so.conf.d/00-custom-openssl.conf
          sudo ldconfig
      - name: Install dependencies
        run: sudo apt-get install -y ninja-build cmake clang libcurl4-openssl-dev nlohmann-json3-dev
      - name: Configure with ${{ matrix.name }}
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}" \
            -DOPENSSL_ROOT_DIR=${{ env.OPENSSL_PREFIX }} \
            -DCMAKE_BUILD_RPATH=${{ env.OPENSSL_PREFIX }}/lib \
            -Wno-dev
      - name: Build
        run: cmake --build build --target cybersec_tests -j$(nproc)
      - name: Run under ${{ matrix.name }}
        env:
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=1"
          LSAN_OPTIONS: "suppressions=${{ github.workspace }}/lsan.supp"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          TSAN_OPTIONS: "halt_on_error=1"
        run: ctest --test-dir build --output-on-failure
