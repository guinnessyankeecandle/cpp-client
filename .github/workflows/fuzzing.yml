name: Fuzzing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fuzz:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y ninja-build cmake clang

      - name: Configure with libFuzzer
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"

      - name: Build
        run: cmake --build build

      # When parsing or crypto input handling exists, add a fuzz target:
      #
      #   src/fuzz/fuzz_input.cpp:
      #     extern "C" int LLVMFuzzerTestOneInput(const uint8_t* data, size_t size) {
      #         // call your parsing or crypto function with data/size
      #         return 0;
      #     }
      #
      #   In src/CMakeLists.txt add:
      #     add_executable(cybersec_fuzz src/fuzz/fuzz_input.cpp)
      #     target_link_libraries(cybersec_fuzz PRIVATE utils crypto comms "-fsanitize=fuzzer,address")
      #
      #   Then change the run step to:
      #     ./build/cybersec_fuzz -max_total_time=30
      - name: Run fuzz targets
        run: echo "Placeholder — fuzz targets added when parsing/crypto input logic exists"
