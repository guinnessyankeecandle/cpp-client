name: Cppcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cppcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=all \
            --std=c++20 \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            "--suppress=unusedFunction:src/*.test.cpp" \
            "--suppress=unusedFunction:src/utils/config_bridge.cpp" \
            src/
