name: Undefined Behaviour Sanitiser
on:
  push:

jobs:
  ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang \
            libssl-dev libcurl4-openssl-dev nlohmann-json3-dev qrencode
      - name: Configure with UBSan
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined" -Wno-dev
      - name: Build
        run: cmake --build build --target cybersec_tests -j$(nproc)
      - name: Run under UBSan
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
