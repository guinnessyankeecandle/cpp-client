name: Undefined Behaviour Sanitiser
on:
  push:

jobs:
  ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL 3.3
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl
          curl -fsSL https://www.openssl.org/source/openssl-3.3.2.tar.gz | tar xz
          cd openssl-3.3.2
          ./Configure --prefix=/usr/local --openssldir=/usr/local/ssl
          make -j$(nproc)
          sudo make install_sw
          sudo ldconfig
      - name: Install dependencies
        run: |
          sudo apt-get install -y ninja-build cmake clang \
            libcurl4-openssl-dev nlohmann-json3-dev qrencode
      - name: Configure with UBSan
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined" \
            -DOPENSSL_ROOT_DIR=/usr/local -Wno-dev
      - name: Build
        run: cmake --build build --target cybersec_tests -j$(nproc)
      - name: Run under UBSan
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
