name: Semgrep

on:
  push:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config "p/c" \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --error \
            src/
